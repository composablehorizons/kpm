name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.5.0
        required: true
        type: string
      publish_maven:
        description: Publish Maven artifacts (disable when retrying an accepted upload)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify release tag
        id: version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "${version%%+*}" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac
      - run: go test ./...
      - run: go run ./scripts/build.go
      - name: Verify the packaged native CLI
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p build/native-release-check
          tar -xzf "dist/kpm_${version}_linux_amd64.tar.gz" -C build/native-release-check
          test "$(build/native-release-check/kpm --version)" = "$version"
          cd dist
          sha256sum --check SHA256SUMS
      - run: ./gradlew :gradle-plugin:test :gradle-plugin:validatePlugins --console=plain
      - name: Verify initialization and module commands
        run: go test ./internal/cli -run TestInitGradleIntegration -count=1
        env:
          KPM_GRADLE_INTEGRATION: '1'
      - name: Verify Kotlin Multiplatform consumer
        run: ./gradlew -p examples/kotlin-library compileKotlinJvm compileKotlinWasmJs generatePomFileForKotlinMultiplatformPublication generatePomFileForJvmPublication --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 7

  maven:
    needs: verify
    if: github.event_name == 'push' || inputs.publish_maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish plugin and marker to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :gradle-plugin:publishAllPublicationsToMavenCentral --no-configuration-cache --console=plain

  github-release:
    needs: [verify, maven]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.maven.result == 'success' || needs.maven.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-release
          path: build/native-release
      - name: Create the draft GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'GitHub release already exists; preserving its publication state.'
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --draft --generate-notes "${flags[@]}"
          fi
      - name: Upload native assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/native-release
          sha256sum --check SHA256SUMS
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/kpm-existing-assets"
          # Compare every existing file before making any changes. A rerun
          # must never mix newly rebuilt assets with an older checksum manifest.
          mkdir -p "$RUNNER_TEMP/kpm-existing-downloads"
          for asset in *; do
            if grep -Fxq "$asset" "$RUNNER_TEMP/kpm-existing-assets"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/kpm-existing-downloads"
              if ! cmp -s "$asset" "$RUNNER_TEMP/kpm-existing-downloads/$asset"; then
                echo "::error::Existing asset differs: $asset. Recover the original verified artifact instead of overwriting it."
                exit 1
              fi
            fi
          done
          for asset in *; do
            if grep -Fxq "$asset" "$RUNNER_TEMP/kpm-existing-assets"; then
              echo "Keeping existing asset: $asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
