name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - run: go run ./scripts/build.go
      - name: Verify native installation
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) asset="kpm_${version}_linux_amd64.tar.gz" ;;
            macOS/ARM64) asset="kpm_${version}_darwin_arm64.tar.gz" ;;
            macOS/X64) asset="kpm_${version}_darwin_amd64.tar.gz" ;;
            Windows/X64) asset="kpm_${version}_windows_amd64.zip" ;;
            Windows/ARM64) asset="kpm_${version}_windows_arm64.zip" ;;
            *) echo 'Unsupported runner'; exit 1 ;;
          esac
          mkdir -p build/native-check
          case "$asset" in
            *.zip) unzip "dist/$asset" -d build/native-check; binary=build/native-check/kpm.exe ;;
            *) tar -xzf "dist/$asset" -C build/native-check; binary=build/native-check/kpm ;;
          esac
          test "$("$binary" --version)" = "$version"
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :gradle-plugin:test :gradle-plugin:validatePlugins --console=plain
      - name: Verify initialization and module commands
        run: go test ./internal/cli -run TestInitGradleIntegration -count=1 -v
        env:
          KPM_GRADLE_INTEGRATION: '1'
      - name: Verify Kotlin Multiplatform consumer
        run: ./gradlew -p examples/kotlin-library compileKotlinJvm compileKotlinWasmJs generatePomFileForKotlinMultiplatformPublication generatePomFileForJvmPublication --console=plain
